name: 📺 Sync Instagram Reels
on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2 AM UTC
  workflow_dispatch:      # Manual trigger
jobs:
  sync-reels:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: 📺 Fetch Instagram reels
        run: node scripts/sync-instagram.js
      - name: 📤 Commit changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add reels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Auto-sync Instagram reels" && git push)
