<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels Archive — irreallab</title>
  <meta name="description" content="Irreallab reels archive: surreal visual experiments, motion studies and cinematic AI-driven worlds.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta property="og:title" content="Reels Archive — irreallab">
  <meta property="og:description" content="Surreal visual experiments and short-form cinematic reels by irreallab.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://irreallab.fr/reels.html">
  <meta property="og:image" content="https://irreallab.fr/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://irreallab.fr/preview.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#060606;
      --bg2:#0d0d0d;
      --line:#1c1c1c;
      --line2:#242424;
      --accent:#d4f03a;
      --text:#ede9df;
      --muted:#6d6d6d;
      --muted2:#222;
      --pad-x:3.5rem;
    }
    @media(max-width:900px){:root{--pad-x:1.5rem}}
    @media(max-width:480px){:root{--pad-x:1.1rem}}

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;min-height:100vh;overflow-x:hidden}
    body:after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.035;pointer-events:none;z-index:9999}

    nav{height:60px;padding:0 var(--pad-x);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(6,6,6,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
    .nav-logo,.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.04em;color:var(--muted);text-decoration:none}
    .nav-logo em,.footer-logo em{color:var(--accent);font-style:normal}
    .nav-links{display:flex;gap:2rem;align-items:center}
    .nav-links a,.footer-link{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-links a:hover,.footer-link:hover{color:var(--accent)}
    .nav-cta{background:var(--accent)!important;color:#060606!important;padding:6px 14px}

    .footer-irreal{position:relative;display:inline-block;animation:footerIrrealBlink 2.2s infinite;will-change:opacity,text-shadow}
    @keyframes footerIrrealBlink{
      0%,74%,100%{color:inherit;opacity:1;text-shadow:none}
      76%{color:var(--accent);opacity:1;text-shadow:0 0 4px rgba(212,240,58,.45),0 0 10px rgba(212,240,58,.22),0 0 18px rgba(212,240,58,.12)}
      78%{color:inherit;text-shadow:none}
      80%{color:var(--accent);opacity:1;text-shadow:0 0 5px rgba(212,240,58,.55),0 0 12px rgba(212,240,58,.28),0 0 20px rgba(212,240,58,.16)}
      82%{color:inherit;text-shadow:none}
      84%{color:var(--accent);opacity:1;text-shadow:0 0 4px rgba(212,240,58,.42),0 0 10px rgba(212,240,58,.20)}
    }

    main{position:relative;padding:clamp(4.5rem,8vw,7rem) var(--pad-x);background:radial-gradient(circle at 85% 12%,rgba(212,240,58,.12),transparent 24%),radial-gradient(circle at 12% 72%,rgba(237,233,223,.045),transparent 28%),linear-gradient(180deg,#060606 0%,#0b0b0b 48%,#060606 100%);isolation:isolate;overflow:hidden}
    main:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(212,240,58,.06) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:82px 82px;mask-image:radial-gradient(circle at 50% 38%,black,transparent 72%);opacity:.45}
    main:after{content:'REELS ARCHIVE';position:absolute;right:var(--pad-x);top:2rem;font-family:'Bebas Neue',sans-serif;font-size:clamp(5rem,14vw,15rem);line-height:.8;color:rgba(255,255,255,.018);z-index:-1;pointer-events:none}

    .head{width:min(1180px,100%);margin:0 auto 2.4rem;border-bottom:1px solid rgba(212,240,58,.18);padding-bottom:2rem;display:flex;justify-content:space-between;gap:2rem;align-items:end;opacity:0;transform:translateY(42px) scale(.985);transition:opacity .95s cubic-bezier(.16,1,.3,1),transform .95s cubic-bezier(.16,1,.3,1)}
    .head.ir-in{opacity:1;transform:none}
    .kicker{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}

    /* TITLE — copied from the front page large electric title rhythm */
    .title{font-family:'Bebas Neue',sans-serif;font-size:clamp(4.2rem,8.5vw,8rem);line-height:.82;letter-spacing:-.025em;position:relative;display:inline-block;cursor:default;color:var(--text);text-shadow:0 0 0 rgba(212,240,58,0);transition:text-shadow .35s ease,filter .35s ease;min-height:1.64em}
    .title span{position:relative;display:block;color:var(--accent);text-shadow:0 0 10px rgba(212,240,58,.16),0 0 22px rgba(212,240,58,.06)}
    .title span:after{content:'_';display:inline-block;margin-left:.08em;color:var(--accent);animation:ir-more-title-blink .85s step-end infinite;text-shadow:0 0 10px rgba(212,240,58,.55),0 0 24px rgba(212,240,58,.28),0 0 44px rgba(212,240,58,.14)}
    .title:before{content:attr(data-glitch);position:absolute;left:0;top:0;width:100%;color:var(--accent);opacity:0;pointer-events:none;mix-blend-mode:screen;transform:translateX(0);clip-path:inset(0 0 72% 0);white-space:pre;line-height:inherit}
    .title:hover{filter:brightness(1.08);text-shadow:0 0 12px rgba(237,233,223,.10),0 0 26px rgba(212,240,58,.16)}
    .title:hover:before{animation:ir-more-title-electric .72s steps(2,end) both}
    @keyframes ir-more-title-blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes ir-more-title-electric{0%{opacity:0;transform:translate(0,0);clip-path:inset(0 0 85% 0)}12%{opacity:.85;transform:translate(-3px,-1px);clip-path:inset(8% 0 68% 0)}24%{opacity:.35;transform:translate(4px,1px);clip-path:inset(46% 0 33% 0)}36%{opacity:.75;transform:translate(-2px,0);clip-path:inset(22% 0 54% 0)}48%{opacity:.18;transform:translate(3px,-1px);clip-path:inset(70% 0 12% 0)}60%{opacity:.65;transform:translate(-1px,1px);clip-path:inset(34% 0 41% 0)}100%{opacity:0;transform:translate(0,0);clip-path:inset(0 0 100% 0)}}

    /* SUBTITLE — same typography and typewriter rhythm as the front page copy */
    .intro{font-family:'Space Mono','Courier New',monospace!important;font-style:normal!important;font-weight:400!important;letter-spacing:.035em!important;text-transform:none!important;font-size:clamp(.78rem,1.15vw,1rem)!important;line-height:1.7!important;color:rgba(237,233,223,.72)!important;max-width:520px!important;margin-top:1.2rem!important;min-height:calc(1em * 1.7 * 3);white-space:normal!important;overflow:visible!important}
    .ir-typewriter{position:relative;white-space:normal!important;overflow:visible;display:block;max-width:100%;vertical-align:bottom}
    .ir-typewriter:after{content:'_';display:inline-block;margin-left:.12em;color:var(--accent);text-shadow:0 0 8px rgba(212,240,58,.55),0 0 22px rgba(212,240,58,.22);animation:ir-typewriter-cursor .8s step-end infinite}
    .ir-typewriter.is-done:after{opacity:.75}
    @keyframes ir-typewriter-cursor{0%,48%{opacity:1}49%,100%{opacity:0}}

    .count{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,233,223,.45);white-space:nowrap}
    .grid{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem;opacity:0;transform:translateY(42px) scale(.985);transition:opacity .95s cubic-bezier(.16,1,.3,1),transform .95s cubic-bezier(.16,1,.3,1)}
    .grid.ir-in{opacity:1;transform:none;transition-delay:.16s}
    .card{border:1px solid rgba(237,233,223,.1);background:rgba(8,8,8,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;cursor:pointer;transition:all .2s ease}
    .card:hover{border-color:rgba(212,240,58,.35);box-shadow:0 24px 80px rgba(212,240,58,.12)}
    .card-top{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
    .num{font-family:'Bebas Neue',sans-serif;font-size:2.3rem;color:rgba(212,240,58,.9);line-height:1;text-shadow:0 0 8px rgba(212,240,58,.10),0 0 18px rgba(212,240,58,.05)}
    .tag{font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;background:rgba(212,240,58,.1);color:var(--accent);padding:4px 9px}
    .embed{min-height:320px;background:#050505;display:flex;align-items:flex-start;justify-content:center;padding:.8rem;overflow:hidden}
    .instagram-media{margin:0 auto!important;max-width:360px!important;min-width:280px!important;width:100%!important}
    .info{padding:.9rem}
    .info h2{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.035em;line-height:.95;margin-bottom:.4rem}
    .sub{font-size:.5rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem}
    .hashtags{font-family:'Space Mono','Courier New',monospace!important;font-style:normal!important;font-weight:400!important;letter-spacing:.035em!important;text-transform:none!important;font-size:clamp(.78rem,1.15vw,1rem)!important;line-height:1.4!important;color:rgba(237,233,223,.72)!important;margin-bottom:1rem;overflow-wrap:anywhere}
    .open{display:inline-block;color:var(--accent);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:2px}

    footer{display:flex;align-items:center;justify-content:space-between;padding:1.8rem var(--pad-x);flex-wrap:wrap;gap:1rem}.footer-logo{font-size:1.2rem}.footer-right{display:flex;gap:2rem;align-items:center;flex-wrap:wrap}.footer-copyright{width:100%;margin-top:.8rem;font-size:.58rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

    @media(max-width:900px){.head{display:block}.intro{margin-top:1.3rem}.count{display:block;margin-top:1rem}.grid{grid-template-columns:1fr}.embed{min-height:280px}}
    @media(max-width:600px){.nav-links{gap:1rem}.nav-hide{display:none}.nav-logo{font-size:1.2rem}.title{font-size:clamp(3.8rem,17vw,6rem)}.embed{min-height:240px;padding:.5rem}.instagram-media{min-width:0!important}.card-top,.info{padding:.8rem}}
    @media(prefers-reduced-motion:reduce){.ir-typewriter:after{display:none}.head,.grid{opacity:1;transform:none}.title span:after{display:none}}
  
    /* CUSTOM CURSOR */
    @media (hover:hover) and (pointer:fine){
      html,body,a,button,.card,.open,.nav-logo,.footer-link,.nav-cta{cursor:none!important}

      .ir-cursor,
      .ir-cursor-trail{
        position:fixed;
        top:0;
        left:0;
        pointer-events:none;
        border-radius:50%;
        transform:translate(-50%,-50%);
        z-index:999999;
      }

      .ir-cursor{
        width:12px;
        height:12px;
        background:var(--accent);
        box-shadow:0 0 8px rgba(212,240,58,.8),0 0 16px rgba(212,240,58,.4),0 0 24px rgba(212,240,58,.2);
      }

      .ir-cursor-trail{
        width:32px;
        height:32px;
        border:1px solid rgba(212,240,58,.35);
        box-shadow:inset 0 0 8px rgba(212,240,58,.15);
      }

      body.ir-hover .ir-cursor{
        width:20px;
        height:20px;
        background:rgba(212,240,58,.4);
        box-shadow:0 0 12px rgba(212,240,58,.6),0 0 24px rgba(212,240,58,.3),0 0 36px rgba(212,240,58,.15);
      }
      body.ir-hover .ir-cursor-trail{
        width:48px;
        height:48px;
        border-color:rgba(212,240,58,.55);
      }
    }
  </style>
</head>
<body>
  <div class="ir-cursor"></div>
  <div class="ir-cursor-trail"></div>

  <nav>
    <a href="/" class="nav-logo"><em>irreallab</em></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/journal">Journal</a>
      <a href="/reels.html" style="color:var(--accent)">Reels</a>
      <a class="nav-hide" href="/team">Team</a>
      <a class="nav-cta" href="mailto:contact@irreallab.fr">Contact</a>
    </div>
  </nav>

  <main>
    <div class="head">
      <div>
        <div class="kicker">Archive</div>
        <h1 class="title" data-glitch="REELS">REELS</h1>
        <div class="intro"><span class="ir-typewriter"></span></div>
      </div>
      <div class="count"></div>
    </div>
    <div class="grid"></div>
  </main>

  <footer>
    <div><a href="/" class="footer-logo"><em>irreallab</em></a></div>
    <div class="footer-right">
      <a class="footer-link" href="/">Home</a>
      <a class="footer-link" href="/journal">Journal</a>
      <a class="footer-link" href="/reels.html">Reels</a>
      <a class="footer-link" href="mailto:contact@irreallab.fr">Contact</a>
      <span style="font-size:.58rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase">© 2026 <span class="footer-irreal">irreal</span>lab</span>
    </div>
    <div class="footer-copyright">Surreal visual experiments, cinematic AI-driven worlds</div>
  </footer>

  <script>
  (function(){
    'use strict';

    const grid = document.querySelector('.grid');
    const head = document.querySelector('.head');
    const count = document.querySelector('.count');
    const esc = s => (new DOMParser).parseFromString(s,'text/html').body.innerText;

    // Animate header on load
    setTimeout(() => head?.classList.add('ir-in'), 150);

    // Typewriter effect
    const intro = document.querySelector('.intro');
    if(intro){
      const typewriter = intro.querySelector('.ir-typewriter');
      const fullText = 'Irreallab's reel archive: experimental motion studies, surreal visual narratives, and cinematic fragments from imagined worlds.';
      const firstText = fullText.split(/(?=[A-Z])/)[0].trim();
      const secondText = fullText.slice(firstText.length);

      const secondElement = document.createElement('span');
      secondElement.style.color = 'var(--accent)';
      typewriter.appendChild(secondElement);

      let firstNode = null;
      for(let i=0;i<typewriter.childNodes.length;i+=1){
        const node = typewriter.childNodes[i];
        if(node.nodeType===3&&node.nodeValue.trim().length>0){firstNode=node;break;}
      }
      if(!firstNode){
        firstNode = document.createTextNode('');
        typewriter.insertBefore(firstNode, secondElement);
      }

      const totalLength = firstText.length + secondText.length;
      let index = 0;
      let deleting = false;
      let pauseTicks = 0;
      const typeSpeed = 115;
      const deleteSpeed = 45;
      const pauseAtEnd = 18;
      const pauseAtStart = 6;

      function renderTitle(){
        const firstCount = Math.min(index, firstText.length);
        const secondCount = Math.max(0, index - firstText.length);
        firstNode.nodeValue = firstText.slice(0, firstCount);
        secondElement.textContent = secondText.slice(0, secondCount);
      }

      function tick(){
        if(!deleting){
          index += 1;
          if(index >= totalLength){
            index = totalLength;
            pauseTicks += 1;
            if(pauseTicks >= pauseAtEnd){deleting = true; pauseTicks = 0;}
          }
        }else{
          index -= 1;
          if(index <= 0){
            index = 0;
            pauseTicks += 1;
            if(pauseTicks >= pauseAtStart){deleting = false; pauseTicks = 0;}
          }
        }
        renderTitle();
        window.setTimeout(tick, deleting ? deleteSpeed : typeSpeed);
      }

      firstNode.nodeValue = '';
      secondElement.textContent = '';
      window.setTimeout(tick, 450);
    }

    function render(reels){
      grid.innerHTML = reels.map((r, i) => {
        const embedHtml = r.video_url
          ? `<video src="${esc(r.video_url)}" poster="${esc(r.thumbnail_url)}" muted loop onmouseover="this.play()" onmouseout="this.pause()" style="width:100%;height:100%;object-fit:cover;border-radius:0;"></video>`
          : `<blockquote class="instagram-media" data-instgrm-permalink="${esc(r.url)}" data-instgrm-version="14" style="background:#FFF;border:0;border-radius:0;box-shadow:none;margin:0;max-width:540px;min-width:326px;padding:0;width:100%;"></blockquote>`;
        return `<article class="card"><div class="card-top"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="tag">${esc(r.status||'Live')}</div></div><div class="embed">${embedHtml}</div><div class="info"><h2>${esc(r.title)}</h2><div class="sub">${esc(r.subtitle||'@irreallab · Watch on Instagram')}</div><p class="hashtags">${esc(r.hashtags)}</p><a class="open" href="${esc(r.url)}" target="_blank" rel="noopener">Open reel ↗</a></div></article>`;
      }).join('');
      count.textContent = String(reels.length).padStart(2,'0') + ' live reels';
      grid.classList.add('ir-in');
      if(window.instgrm&&window.instgrm.Embeds){window.instgrm.Embeds.process();}
      
      // Initialize audio after reels are rendered
      setTimeout(() => {
        if(window.initializeReelsAudioFromAttributes){
          window.initializeReelsAudioFromAttributes();
        }
      }, 100);
    }

    function loadReels(){
      loadFromStatic();
    }

    function loadFromStatic(){
      fetch('reels.json',{cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>{count.textContent='Unable to load reels.json';});
    }

    function initCursor(){
      const cursor = document.querySelector('.ir-cursor');
      const trail = document.querySelector('.ir-cursor-trail');
      if(!cursor||!trail) return;

      let tx = 0, ty = 0, mx = 0, my = 0;

      document.addEventListener('mousemove', e => {
        mx = e.clientX;
        my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top = my + 'px';
      });

      function animate(){
        tx += (mx - tx) * 0.14;
        ty += (my - ty) * 0.14;
        trail.style.left = tx + 'px';
        trail.style.top = ty + 'px';
        requestAnimationFrame(animate);
      }
      animate();

      document.querySelectorAll('a,button,.card,.open').forEach(el => {
        el.addEventListener('mouseenter', () => document.body.classList.add('ir-hover'));
        el.addEventListener('mouseleave', () => document.body.classList.remove('ir-hover'));
      });
    }

    // Load reels and initialize
    initCursor();
    loadReels();
  })();
  </script>

  <!-- Load audio sync manager AFTER page scripts -->
  <script src="reels-audio-sync.js"></script>

  <!-- Instagram embed script -->
  <script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
