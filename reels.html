<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels Archive — irreallab</title>
  <meta name="description" content="Irreallab reels archive: surreal visual experiments, motion studies and cinematic AI-driven worlds.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta property="og:title" content="Reels Archive — irreallab">
  <meta property="og:description" content="Surreal visual experiments and short-form cinematic reels by irreallab.">
  <meta property="og:image" content="https://irreallab.fr/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --surface-light: #242424;
      --accent: #d4f03a;
      --accent-dark: #a8d700;
      --text: #f0f0f0;
      --text-muted: #999;
      --border: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(212,240,58,.03), transparent 40%),
                  radial-gradient(circle at 80% 20%, rgba(212,240,58,.02), transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    nav {
      height: 70px;
      padding: 0 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,.95);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: .06em;
      color: var(--text);
      text-decoration: none;
    }

    .logo em {
      color: var(--accent);
      font-style: normal;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: all .3s ease;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent);
    }

    main {
      padding: 4rem 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 4rem;
      animation: fadeInUp .8s ease-out;
    }

    .header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: .5rem;
      color: var(--text);
    }

    .header h1 span {
      color: var(--accent);
    }

    .header p {
      font-size: .9rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 600px;
      margin-top: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .reel-card {
      group;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
      transition: all .4s cubic-bezier(.16,1,.3,1);
      cursor: pointer;
    }

    .reel-card:hover {
      border-color: var(--accent);
      background: var(--surface-light);
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(212,240,58,.15);
    }

    .reel-media {
      position: relative;
      width: 100%;
      aspect-ratio: 9/16;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reel-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .reel-card:hover .reel-media video {
      transform: scale(1.02);
    }

    .play-icon {
      position: absolute;
      width: 60px;
      height: 60px;
      background: rgba(212,240,58,.2);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 24px;
      opacity: 0;
      transition: all .4s ease;
      pointer-events: none;
    }

    .reel-card:hover .play-icon {
      opacity: 1;
      transform: scale(1);
    }

    .reel-info {
      padding: 1.5rem;
    }

    .reel-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .5rem;
    }

    .reel-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: .02em;
      margin-bottom: .5rem;
      color: var(--text);
      line-height: 1.2;
    }

    .reel-meta {
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: .8rem;
      letter-spacing: .05em;
    }

    .reel-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .tag {
      background: rgba(212,240,58,.1);
      color: var(--accent);
      padding: .4rem .8rem;
      border-radius: 4px;
      font-size: .65rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .reel-link {
      display: inline-block;
      margin-top: 1rem;
      color: var(--accent);
      text-decoration: none;
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--accent);
      transition: all .3s ease;
    }

    .reel-link:hover {
      padding-left: .4rem;
      padding-right: .4rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 3rem 2.5rem;
      background: rgba(10,10,10,.95);
      margin-top: 6rem;
    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .footer-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      color: var(--text);
    }

    .footer-logo em {
      color: var(--accent);
    }

    .footer-links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: color .3s ease;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-copyright {
      width: 100%;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-size: .65rem;
      color: var(--text-muted);
      letter-spacing: .08em;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.5rem;
      }
    }

    @media(max-width: 600px) {
      nav {
        padding: 0 1.5rem;
      }

      main {
        padding: 2rem 1.5rem;
      }

      .nav-links {
        gap: 1.5rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 2rem;
      }
    }

    @media(prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo"><em>irreallab</em></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/journal">Journal</a>
      <a href="/reels.html" class="active">Reels</a>
      <a href="mailto:contact@irreallab.fr">Contact</a>
    </div>
  </nav>

  <main>
    <div class="header">
      <h1><span>Reels</span> Archive</h1>
      <p>Surreal visual experiments, motion studies, and cinematic fragments from imagined worlds. Hover to play with synchronized audio.</p>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="footer-content">
      <div>
        <a href="/" class="footer-logo"><em>irreallab</em></a>
      </div>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/journal">Journal</a>
        <a href="/reels.html">Reels</a>
        <a href="mailto:contact@irreallab.fr">Contact</a>
      </div>
    </div>
    <div class="footer-copyright">
      © 2026 irreallab — Surreal visual experiments and cinematic worlds
    </div>
  </footer>

  <script>
    (function() {
      'use strict';

      const grid = document.getElementById('grid');
      const esc = s => (new DOMParser).parseFromString(s,'text/html').body.innerText;

      function render(reels) {
        grid.innerHTML = reels.map((reel, i) => {
          const hasVideo = reel.video_url && reel.video_url.trim().length > 0;
          const videoHtml = hasVideo
            ? `<video src="${esc(reel.video_url)}" poster="${esc(reel.thumbnail_url)}" muted loop></video>`
            : `<blockquote class="instagram-media" data-instgrm-permalink="${esc(reel.url)}" data-instgrm-version="14" style="background:#FFF;border:0;border-radius:0;box-shadow:none;margin:0;max-width:540px;min-width:326px;padding:0;width:100%;"></blockquote>`;

          return `
            <div class="reel-card" ${reel.audio_url ? `data-audio-url="${esc(reel.audio_url)}"` : ''}>
              <div class="reel-media">
                ${videoHtml}
                <div class="play-icon">▶</div>
              </div>
              <div class="reel-info">
                <div class="reel-number">Reel ${String(i+1).padStart(2,'0')}</div>
                <h2 class="reel-title">${esc(reel.title)}</h2>
                <div class="reel-meta">${esc(reel.subtitle || '@irreallab')}</div>
                <div class="reel-tags">
                  ${reel.hashtags.split('\n').slice(0,3).map(tag => `<span class="tag">${esc(tag.trim())}</span>`).join('')}
                </div>
                <a href="${esc(reel.url)}" target="_blank" class="reel-link">Open on Instagram ↗</a>
              </div>
            </div>
          `;
        }).join('');

        if (window.instgrm && window.instgrm.Embeds) {
          window.instgrm.Embeds.process();
        }

        setTimeout(() => {
          if (window.initializeReelsAudioFromAttributes) {
            window.initializeReelsAudioFromAttributes();
          }
        }, 100);

        // Add hover play/pause for videos
        document.querySelectorAll('.reel-media video').forEach(video => {
          const card = video.closest('.reel-card');
          card.addEventListener('mouseenter', () => video.play().catch(() => {}));
          card.addEventListener('mouseleave', () => video.pause());
        });
      }

      function loadReels() {
        fetch('reels.json', { cache: 'no-store' })
          .then(r => r.json())
          .then(render)
          .catch(() => {
            grid.innerHTML = '<div class="empty-state">Unable to load reels. Please try again later.</div>';
          });
      }

      loadReels();
    })();
  </script>

  <!-- Audio sync manager -->
  <script src="reels-audio-sync.js"></script>

  <!-- Instagram embed script -->
  <script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
