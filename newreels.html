<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — irreallab</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #060606;
      --line:    #1c1c1c;
      --accent:  #d4f03a;
      --text:    #ede9df;
      --muted:   #4a4a4a;
      --pad-x:   3.5rem;
    }
    @media (max-width: 900px) { :root { --pad-x: 1.5rem; } }
    @media (max-width: 480px) { :root { --pad-x: 1.1rem; } }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.035; pointer-events: none; z-index: 9999;
    }

    .marquee {
      background: var(--accent);
      overflow: hidden;
      position: relative;
      z-index: 200;
      border-bottom: 1.5px solid #000;
    }
    .marquee.is-sticky {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100000;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    .marquee-spacer { height: 0; pointer-events: none; }
    .marquee-spacer.is-active { height: var(--marquee-height, 34px); }
    .marquee-track {
      display: inline-flex; white-space: nowrap;
      animation: mscroll 22s linear infinite;
    }
    .marquee:hover .marquee-track { animation-play-state: paused; }
    .marquee-item {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem; letter-spacing: 0.15em;
      color: #060606; text-decoration: none;
      padding: 8px 24px; display: inline-block;
    }
    .marquee-dot { color: #06060650; padding: 8px 4px; font-size: .7rem; }
    @keyframes mscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--pad-x); height: 60px;
      border-bottom: 1px solid var(--line);
      position: relative; z-index: 100;
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem; letter-spacing: .04em;
      color: var(--text); text-decoration: none;
    }
    .nav-logo em { color: var(--accent); font-style: normal; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a, .logout-btn {
      font-size: .6rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color .2s;
      border: none; background: none; cursor: pointer; padding: 0;
      font-family: 'Space Mono', monospace;
    }
    .nav-links a:hover, .logout-btn:hover { color: var(--text); }

    nav.is-sticky {
      position: fixed;
      left: 0;
      top: var(--marquee-height, 34px);
      width: 100%;
      z-index: 99999;
      background: rgba(6,6,6,.82);
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px rgba(0,0,0,.34);
    }

    .nav-spacer { height: 0; pointer-events: none; }
    .nav-spacer.is-active { height: var(--nav-height, 60px); }

    main {
      padding: 4rem var(--pad-x) 3rem;
      min-height: 60vh;
    }

    .login-container, .admin-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 94px);
      gap: 2rem;
    }

    .hidden { display: none !important; }

    .login-box, .upload-form {
      border: 1px solid rgba(212,240,58,.2);
      background: rgba(8,8,8,.72);
      backdrop-filter: blur(18px);
      padding: 3rem;
      width: 100%;
      max-width: 520px;
    }

    .login-title, .admin-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: .04em;
      color: var(--text);
      margin-bottom: 2rem;
      text-align: center;
    }
    .login-title span, .admin-title span { color: var(--accent); }

    .admin-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: .6rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .6rem;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(212,240,58,.15);
      color: var(--text);
      padding: 0.8rem;
      font-family: 'Space Mono', monospace;
      font-size: .9rem;
      transition: all .2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(212,240,58,.08);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .video-preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 1rem;
      border: 1px solid rgba(212,240,58,.15);
      display: none;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: #060606;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: .95rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s;
      margin-top: 1rem;
    }

    button:hover {
      background: #e0ff52;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212,240,58,.3);
    }

    .status-message {
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: none;
      font-size: .9rem;
    }

    .status-message.active { display: block; }
    .status-message.success {
      background: rgba(212,240,58,.15);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .status-message.error {
      background: rgba(255,0,0,.15);
      border: 1px solid rgba(255,0,0,.5);
      color: rgba(255,200,200,.9);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.8rem var(--pad-x);
      flex-wrap: wrap;
      gap: 1rem;
      border-top: 1px solid var(--line);
      background: var(--bg);
      margin-top: auto;
      font-size: .6rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .footer-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: .04em;
      color: var(--text);
      text-decoration: none;
    }

    .footer-logo em { color: var(--accent); font-style: normal; }

    .footer-link {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }
    .footer-link:hover { color: var(--text); }

    .footer-copyright {
      width: 100%;
      margin-top: .8rem;
      font-size: .58rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .nav-links a.nav-hide { display: none; }
      .nav-logo { font-size: 1.2rem; }
      .login-box, .upload-form { padding: 2rem; }
    }

  </style>
</head>
<body>
  <!-- MARQUEE -->
  <div id="marquee-spacer" class="marquee-spacer"></div>
  <div id="site-content" class="marquee">
    <div class="marquee-track">
      <a href="https://www.instagram.com/irreallab/" target="_blank" rel="noopener" class="marquee-item">@irreallab on Instagram</a>
      <span class="marquee-dot">✦</span>
      <a href="https://www.instagram.com/irreallab/" target="_blank" rel="noopener" class="marquee-item">Visual Experiments</a>
      <span class="marquee-dot">✦</span>
      <a href="https://www.instagram.com/irreallab/" target="_blank" rel="noopener" class="marquee-item">Follow on Instagram</a>
      <span class="marquee-dot">✦</span>
      <span class="marquee-item">Short-form / Reels</span>
      <span class="marquee-dot">✦</span>
    </div>
  </div>

  <!-- NAV -->
  <div id="nav-spacer" class="nav-spacer"></div>
  <nav id="main-nav">
    <a href="/main.html" class="nav-logo"><span>irreal</span><em>lab_</em></a>
    <div class="nav-links">
      <a href="/main.html">Home</a>
      <a href="reels.html">Reels</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <!-- LOGIN SCREEN -->
  <main id="loginContainer" class="login-container">
    <div class="login-box">
      <h1 class="login-title"><span>Admin</span> Login</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="userId">ID</label>
          <input type="text" id="userId" name="userId" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="userPassword">Password</label>
          <input type="password" id="userPassword" name="userPassword" required autocomplete="off">
        </div>
        <button type="submit">Access Admin Panel</button>
        <div id="loginError" class="status-message error"></div>
      </form>
    </div>
  </main>

  <!-- ADMIN SCREEN -->
  <main id="adminContainer" class="admin-container hidden">
    <div class="admin-header">
      <h1 class="admin-title">Upload <span>New Reel</span></h1>
    </div>

    <div class="upload-form">
      <div id="statusMessage" class="status-message"></div>

      <form id="reelForm">
        <div class="form-group">
          <label for="videoFile">Video File *</label>
          <input type="file" id="videoFile" name="videoFile" accept="video/*" required>
          <video id="videoPreview" class="video-preview"></video>
        </div>

        <div class="form-group">
          <label for="reelTitle">Title *</label>
          <input type="text" id="reelTitle" name="reelTitle" placeholder="e.g., carved origins" required>
        </div>

        <div class="form-group">
          <label for="reelHashtags">Hashtags *</label>
          <textarea id="reelHashtags" name="reelHashtags" placeholder="#irreallab #surrealvisuals&#10;#dreamlogic" required></textarea>
        </div>

        <div class="form-group">
          <label for="reelUrl">Instagram URL (optional)</label>
          <input type="url" id="reelUrl" name="reelUrl" placeholder="https://www.instagram.com/reel/...">
        </div>

        <button type="submit">Upload & Publish Reel</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-logo"><span>irreal</span><em>lab_</em></div>
    <div style="display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;">
      <a href="https://www.instagram.com/irreallab/" target="_blank" rel="noopener" class="footer-link">Instagram ↗</a>
      <span class="footer-link">© 2025 irreallab</span>
    </div>
    <p class="footer-copyright">© irreallab — Radu Nechita (Instagram) · Site rédaction : © Hélène Nechita · Tous droits réservés.</p>
  </footer>

  <script>
    'use strict';

    const loginContainer = document.getElementById('loginContainer');
    const adminContainer = document.getElementById('adminContainer');
    const loginForm = document.getElementById('loginForm');
    const reelForm = document.getElementById('reelForm');
    const logoutBtn = document.getElementById('logoutBtn');
    const videoInput = document.getElementById('videoFile');
    const videoPreview = document.getElementById('videoPreview');
    const statusMessage = document.getElementById('statusMessage');
    const loginError = document.getElementById('loginError');

    const VALID_ID = 'radu';
    const VALID_PASSWORD = 'lovemylife27';

    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        videoPreview.src = url;
        videoPreview.style.display = 'block';
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('userId').value;
      const password = document.getElementById('userPassword').value;

      if (id === VALID_ID && password === VALID_PASSWORD) {
        loginError.classList.remove('active');
        loginContainer.classList.add('hidden');
        adminContainer.classList.remove('hidden');
        updateSticky();
      } else {
        loginError.textContent = 'Invalid credentials';
        loginError.classList.add('active');
      }
    });

    logoutBtn.addEventListener('click', () => {
      loginForm.reset();
      videoPreview.style.display = 'none';
      reelForm.reset();
      statusMessage.classList.remove('active', 'success', 'error');
      adminContainer.classList.add('hidden');
      loginContainer.classList.remove('hidden');
      updateSticky();
    });

    reelForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const videoFile = videoInput.files[0];
      const title = document.getElementById('reelTitle').value;
      const hashtags = document.getElementById('reelHashtags').value;
      const url = document.getElementById('reelUrl').value || 'https://www.instagram.com/irreallab/';

      if (!videoFile) {
        showStatus('Please select a video file', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('video', videoFile);
      formData.append('title', title);
      formData.append('hashtags', hashtags);
      formData.append('url', url);

      try {
        const response = await fetch('/api/upload-reel', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          showStatus('Reel published successfully! 🎬', 'success');
          reelForm.reset();
          videoPreview.style.display = 'none';
          setTimeout(() => {
            window.location.href = '/reels.html';
          }, 2000);
        } else {
          showStatus(data.error || 'Upload failed', 'error');
        }
      } catch (err) {
        showStatus('Error uploading reel: ' + err.message, 'error');
      }
    });

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type} active`;
    }

    function updateSticky() {
      const marquee = document.getElementById('site-content');
      const marqueespacer = document.getElementById('marquee-spacer');
      const nav = document.getElementById('main-nav');
      const navSpacer = document.getElementById('nav-spacer');

      if (!marquee || !nav) return;

      const marqueeHeight = marquee.offsetHeight;
      const navHeight = nav.offsetHeight;

      document.documentElement.style.setProperty('--marquee-height', marqueeHeight + 'px');
      document.documentElement.style.setProperty('--nav-height', navHeight + 'px');

      if (window.scrollY > 0) {
        marquee.classList.add('is-sticky');
        marqueespacer.classList.add('is-active');
      } else {
        marquee.classList.remove('is-sticky');
        marqueespacer.classList.remove('is-active');
      }

      if (window.scrollY > marqueeHeight) {
        nav.classList.add('is-sticky');
        navSpacer.classList.add('is-active');
      } else {
        nav.classList.remove('is-sticky');
        navSpacer.classList.remove('is-active');
      }
    }

    window.addEventListener('scroll', updateSticky, { passive: true });
    window.addEventListener('resize', updateSticky);
    updateSticky();
  </script>
</body>
</html>
